name: Update @supabase/supabase-js

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to update to (leave empty for latest)'
        required: false
        type: string
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 09:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  update-supabase-js:
    runs-on: ubuntu-latest
    concurrency:
      group: update-supabase-js
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve target version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "value=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(pnpm view @supabase/supabase-js version 2>/dev/null)" >> "$GITHUB_OUTPUT"
          fi

      # supabase-js and realtime-js share a version. Pin every workspace to the
      # same exact version so the lockfile holds a single realtime-js copy;
      # two copies break typecheck with mismatched RealtimeChannel types.
      - name: Update package.json files
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          node -e "
            const fs = require('node:fs')
            const pins = {
              'package.json': ['@supabase/supabase-js'],
              'packages/realtime-core/package.json': ['@supabase/supabase-js'],
              'packages/tests/package.json': ['@supabase/supabase-js', '@supabase/realtime-js'],
            }
            for (const [file, deps] of Object.entries(pins)) {
              const pkg = JSON.parse(fs.readFileSync(file, 'utf8'))
              for (const dep of deps) {
                if (!pkg.dependencies?.[dep]) throw new Error(dep + ' missing from ' + file)
                pkg.dependencies[dep] = process.env.VERSION
              }
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n')
            }
          "

      - run: pnpm install --no-frozen-lockfile

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          # main requires verified signatures; this commits through the API as
          # github-actions[bot] so GitHub signs it.
          sign-commits: true
          commit-message: 'chore: update @supabase/supabase-js to ${{ steps.version.outputs.value }}'
          title: 'chore: update @supabase/supabase-js to ${{ steps.version.outputs.value }}'
          body: |
            Updates `@supabase/supabase-js` to `${{ steps.version.outputs.value }}`.

            This PR was created automatically by the weekly update workflow.
          branch: 'chore/update-supabase-js-${{ steps.version.outputs.value }}'
          base: ${{ github.event.repository.default_branch }}
          delete-branch: true
